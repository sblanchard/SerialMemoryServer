# Cloudflare Tunnel Configuration for SerialMemory
#
# For Windows native cloudflared (not Docker):
# 1. Create a tunnel: cloudflared tunnel create serialmemory
# 2. Copy credentials to ~/.cloudflared/ or specify with credentials-file
# 3. Update the tunnel ID below
# 4. Add DNS: cloudflared tunnel route dns serialmemory serialmemory.serialcoder.com
# 5. Add DNS: cloudflared tunnel route dns serialmemory memory.serialcoder.com
# 6. Run: cloudflared tunnel --config ops/cloudflared/config.yml run
#
# Docker services exposed on localhost:
#   - API: localhost:5000
#   - Dashboard API: localhost:5001
#   - Web Admin: localhost:5002

tunnel: 54f487a0-dcef-4bb4-af20-459d889c1cee
credentials-file: C:\Users\serialcoder\.cloudflared\54f487a0-dcef-4bb4-af20-459d889c1cee.json

ingress:
  # SignalR WebSocket connections (for real-time updates)
  - hostname: serialmemory.serialcoder.com
    path: /hubs/*
    service: http://localhost:5000
    originRequest:
      noTLSVerify: true

  # Health check (direct to API)
  - hostname: serialmemory.serialcoder.com
    path: /health
    service: http://localhost:5000

  # Web admin dashboard - ALL requests including /api/* go through web-admin
  # The web-admin proxies /api/* requests to the API with proper auth headers
  - hostname: serialmemory.serialcoder.com
    service: http://localhost:5002
    originRequest:
      noTLSVerify: true

  # MCP API for memory.* subdomain (Claude/Cursor connections)
  - hostname: memory.serialcoder.com
    service: http://localhost:5000
    originRequest:
      noTLSVerify: true

  # Catch-all 404
  - service: http_status:404
