# =============================================================================
# SerialMemory Complete Stack
# =============================================================================
# Production-ready deployment with all services.
#
# Quick Start:
#   docker compose up -d
#   scripts/bootstrap-dev.ps1  (Windows)
#   scripts/bootstrap-dev.sh   (Linux/Mac)
#
# Services:
#   - PostgreSQL + pgvector:    localhost:5435
#   - SerialMemory MCP Core:    stdio (for Claude)
#   - SerialMemory API:         localhost:5000
#   - Dashboard API:            localhost:5001
#   - Ollama (embeddings):      localhost:11434 (WSL - not in Docker)
#   - Redis:                    localhost:6379
#   - Prometheus:               localhost:9090
#   - Grafana:                  localhost:3001
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: serialmemory-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contextdb
    ports:
      - "5435:5432"
    volumes:
      - ./ops/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./ops/eventsourcing_schema.sql:/docker-entrypoint-initdb.d/02-eventsourcing.sql:ro
      - ./ops/multi_tenant_schema.sql:/docker-entrypoint-initdb.d/03-multi-tenant.sql:ro
      - ./ops/rls_policies.sql:/docker-entrypoint-initdb.d/04-rls.sql:ro
      - ./ops/usage_metering_schema.sql:/docker-entrypoint-initdb.d/05-usage-metering.sql:ro
      - ./ops/admin_actions_schema.sql:/docker-entrypoint-initdb.d/06-admin-actions.sql:ro
      - ./ops/job_supervision_schema.sql:/docker-entrypoint-initdb.d/07-job-supervision.sql:ro
      - ./ops/telemetry_schema.sql:/docker-entrypoint-initdb.d/08-telemetry.sql:ro
      - ./ops/reasoning_schema.sql:/docker-entrypoint-initdb.d/09-reasoning.sql:ro
      - ./ops/mind_health_schema.sql:/docker-entrypoint-initdb.d/10-mind-health.sql:ro
      - ./ops/emergency_rls_fix.sql:/docker-entrypoint-initdb.d/99-rls-fix.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contextdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Embeddings: Ollama runs locally on WSL (not in Docker)
  # Access via host.docker.internal:11434 from containers
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # SerialMemory API (REST endpoints)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: SerialMemory.Api/Dockerfile
    container_name: serialmemory-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=contextdb_app
      - POSTGRES_PASSWORD=contextdb_app_secure_password_change_me
      - POSTGRES_DB=contextdb
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=contextdb;Username=contextdb_app;Password=contextdb_app_secure_password_change_me
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=contextdb;Username=contextdb_app;Password=contextdb_app_secure_password_change_me
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - ConnectionStrings__Redis=redis:6379
      - RabbitMq__Host=rabbitmq
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production-32chars}
      - JWT_ISSUER=serialmemory
      - JWT_AUDIENCE=serialmemory-api
      # Internal token key for dashboard-to-API communication (base64 64-byte key)
      # WARNING: Change this in production! Generate with: openssl rand -base64 64 | tr -d '\n'
      - INTERNAL_TOKEN_KEY=${INTERNAL_TOKEN_KEY:-c2VyaWFsbWVtb3J5LWRldi1pbnRlcm5hbC10b2tlbi1rZXktMjAyNC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1ub3ctcGxlYXNlLWNoYW5nZS1tZQ==}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-sm_live_svc_serialmemory_admin_key_2024}
      # Deployment Mode: PublicSaaS (default) or SelfHosted
      - SERIALMEMORY_DEPLOYMENT_MODE=${SERIALMEMORY_DEPLOYMENT_MODE:-SelfHosted}
      - SERIALMEMORY_ENABLE_QUOTAS=${SERIALMEMORY_ENABLE_QUOTAS:-false}
      - SERIALMEMORY_DISABLE_POWER_MODE=${SERIALMEMORY_DISABLE_POWER_MODE:-false}
      - SERIALMEMORY_LICENSE_KEY=${SERIALMEMORY_LICENSE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Dashboard API (Tenant Self-Service + Signup)
  # ---------------------------------------------------------------------------
  dashboard-api:
    build:
      context: .
      dockerfile: SerialMemory.Api.Dashboard/Dockerfile
    container_name: serialmemory-dashboard
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=contextdb_app
      - POSTGRES_PASSWORD=contextdb_app_secure_password_change_me
      - POSTGRES_DB=contextdb
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=contextdb;Username=contextdb_app;Password=contextdb_app_secure_password_change_me
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=contextdb;Username=contextdb_app;Password=contextdb_app_secure_password_change_me
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production-32chars}
      - JWT_ISSUER=serialmemory
      - JWT_AUDIENCE=serialmemory-api
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_your_test_key_here}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_your_publishable_key_here}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_your_webhook_secret_here}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-price_pro_monthly}
      - STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-price_enterprise_monthly}
      # Azure Communication Services for email
      - SERIALMEMORY_ACS_CONNECTION=${SERIALMEMORY_ACS_CONNECTION:-}
      - SERIALMEMORY_EMAIL_SENDER=${SERIALMEMORY_EMAIL_SENDER:-}
      - SERIALMEMORY_BASE_URL=${SERIALMEMORY_BASE_URL:-http://localhost:5002}
      # Deployment Mode
      - SERIALMEMORY_DEPLOYMENT_MODE=${SERIALMEMORY_DEPLOYMENT_MODE:-SelfHosted}
      - SERIALMEMORY_ENABLE_QUOTAS=${SERIALMEMORY_ENABLE_QUOTAS:-false}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Web Admin Portal (Razor Pages)
  # ---------------------------------------------------------------------------
  web-admin:
    build:
      context: .
      dockerfile: SerialMemory.Web/Dockerfile.admin
    container_name: serialmemory-web-admin
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - API_BASE_URL=http://api:8080
      - DASHBOARD_API_URL=http://dashboard-api:8080
      - PUBLIC_API_URL=http://localhost:5000
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_your_publishable_key_here}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-sm_live_svc_serialmemory_admin_key_2024}
      # Internal token key for dashboard-to-API communication (must match API)
      # WARNING: Change this in production! Must match the API service key
      - INTERNAL_TOKEN_KEY=${INTERNAL_TOKEN_KEY:-c2VyaWFsbWVtb3J5LWRldi1pbnRlcm5hbC10b2tlbi1rZXktMjAyNC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1ub3ctcGxlYXNlLWNoYW5nZS1tZQ==}
      # Data Protection keys path (persisted across container restarts)
      - DATA_PROTECTION_PATH=/app/keys
      # Deployment Mode
      - SERIALMEMORY_DEPLOYMENT_MODE=${SERIALMEMORY_DEPLOYMENT_MODE:-SelfHosted}
      - SERIALMEMORY_ENABLE_QUOTAS=${SERIALMEMORY_ENABLE_QUOTAS:-false}
      - SERIALMEMORY_DISABLE_POWER_MODE=${SERIALMEMORY_DISABLE_POWER_MODE:-false}
    volumes:
      - web_admin_keys:/app/keys
    depends_on:
      - api
      - dashboard-api

  # ---------------------------------------------------------------------------
  # Redis (caching, rate limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: serialmemory-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # Message Queue: RabbitMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: serialmemory-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: serialmemory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: serialmemory-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # MCP Client (Docker-first STDIO proxy for Claude Desktop)
  # ---------------------------------------------------------------------------
  mcp-client:
    build:
      context: SerialMemory.McpClient
      dockerfile: Dockerfile
    container_name: serialmemory-mcp-client
    image: serialcoder/serialmemory-mcp:latest
    environment:
      - MCP_SERVER_URL=http://api:8080
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_MODE=developer
    stdin_open: true
    tty: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  web_admin_keys:
